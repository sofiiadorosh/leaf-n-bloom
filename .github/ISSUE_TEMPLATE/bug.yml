name: Bug fix
description: Report a defect to fix.
title: 'fix: '
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is broken?
      placeholder: Write here...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can someone reproduce the bug?
      placeholder: Write here...
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should happen?
      placeholder: Write here...
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What happens instead?
      placeholder: Write here...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How can we verify the fix?
      placeholder: Write here...
    validations:
      required: true
