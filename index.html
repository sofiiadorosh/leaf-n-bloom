<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaf &amp; Bloom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Inter:wght@400;500;600&family=Marcellus&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <button
          class="menu"
          type="button"
          aria-expanded="false"
          aria-controls="main-navigation"
          aria-label="Open menu"
        >
          <span class="menu__icon"></span>
        </button>
        <a class="logo" aria-current="page">
          <svg class="logo__icon" width="25" height="31" aria-hidden="true">
            <use href="/icons/sprite.svg#logo"></use>
          </svg>
          <span class="logo__title">Leaf &amp; Bloom</span>
        </a>
        <nav
          class="navigation"
          id="main-navigation"
          aria-label="Main navigation"
        >
          <ul class="navigation__list">
            <li class="navigation__item">
              <a class="navigation__link" aria-current="page">Home</a>
            </li>
            <li class="navigation__item">
              <a class="navigation__link" href="./shop.html">Shop</a>
            </li>
          </ul>
        </nav>
        <a class="cart" href="./cart.html">
          <svg class="cart__icon" width="24" height="24" aria-hidden="true">
            <use href="/icons/sprite.svg#cart"></use>
          </svg>
          <span class="visually-hidden">Cart</span>
        </a>
      </div>
    </header>

    <main class="main">
      <section class="page">
        <div class="container page__container">
          <h1 class="page__title">About us</h1>
          <p>
            Leaf &amp; Bloom is a small online store of houseplants. The about
            page with the team is coming soon.
          </p>
        </div>
      </section>

      <section class="categories" aria-labelledby="categories-title">
        <div class="container">
          <div class="categories__header">
            <h2 class="categories__title" id="categories-title">
              Shop by Category
            </h2>
            <a class="categories__link" href="./shop.html">
              View All
              <svg
                class="categories__link-icon"
                width="16"
                height="16"
                viewBox="0 0 16 16"
                aria-hidden="true"
              >
                <path
                  d="M3 8h10M9 4l4 4-4 4"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
          <ul class="categories__list"></ul>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/about.ts"></script>
  </body>
</html>
