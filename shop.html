<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | Leaf &amp; Bloom</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@600;700&family=Inter:wght@400;500;600&family=Marcellus&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container header__container">
        <button
          class="menu"
          type="button"
          aria-expanded="false"
          aria-controls="main-navigation"
          aria-label="Open menu"
        >
          <span class="menu__icon"></span>
        </button>
        <a class="logo" href="./">
          <svg class="logo__icon" width="25" height="31" aria-hidden="true">
            <use href="/icons/sprite.svg#logo"></use>
          </svg>
          <span class="logo__title">Leaf &amp; Bloom</span>
        </a>
        <nav
          class="navigation"
          id="main-navigation"
          aria-label="Main navigation"
        >
          <ul class="navigation__list">
            <li class="navigation__item">
              <a class="navigation__link" href="./">Home</a>
            </li>
            <li class="navigation__item">
              <a class="navigation__link" aria-current="page">Shop</a>
            </li>
          </ul>
        </nav>
        <a class="cart" href="./cart.html">
          <svg class="cart__icon" width="24" height="24" aria-hidden="true">
            <use href="/icons/sprite.svg#cart"></use>
          </svg>
          <span class="visually-hidden">Cart</span>
        </a>
      </div>
    </header>

    <main class="main">
      <section class="shop" aria-labelledby="shop-title">
        <div class="container">
          <h1 class="visually-hidden" id="shop-title">Shop</h1>

          <div class="shop__layout">
            <aside class="shop__sidebar">
              <button
                class="filters-toggle"
                type="button"
                aria-expanded="false"
                aria-controls="filters"
              >
                <svg
                  class="filters-toggle__icon"
                  width="20"
                  height="20"
                  aria-hidden="true"
                >
                  <use href="/icons/sprite.svg#filter"></use>
                </svg>
                Filters
              </button>

              <form
                class="filters"
                id="filters"
                aria-labelledby="filters-title"
              >
                <div class="filters__header">
                  <h2 class="filters__title" id="filters-title">
                    <svg
                      class="filters__title-icon"
                      width="22"
                      height="22"
                      aria-hidden="true"
                    >
                      <use href="/icons/sprite.svg#filter"></use>
                    </svg>
                    Filter Plants
                  </h2>
                  <button class="filters__reset" type="reset">Reset</button>
                </div>

                <div class="filters__group">
                  <label class="filters__label" for="filter-search"
                    >Search</label
                  >
                  <div class="filters__search">
                    <svg
                      class="filters__search-icon"
                      width="18"
                      height="18"
                      aria-hidden="true"
                    >
                      <use href="/icons/sprite.svg#search"></use>
                    </svg>
                    <input
                      class="filters__field filters__field_search"
                      id="filter-search"
                      type="search"
                      name="search"
                      placeholder="Search plants"
                      autocomplete="off"
                    />
                  </div>
                </div>

                <fieldset class="filters__group">
                  <legend class="filters__label">Plant Type</legend>
                  <div class="filters__pills filters__categories">
                    <label class="pill">
                      <input
                        class="pill__input"
                        type="radio"
                        name="category"
                        value="all"
                        checked
                      />
                      <span class="pill__text">All</span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="filters__group">
                  <legend class="filters__label">Light Needs</legend>
                  <div class="filters__pills">
                    <label class="pill">
                      <input
                        class="pill__input"
                        type="checkbox"
                        name="light"
                        value="bright"
                      />
                      <span class="pill__text">
                        <svg
                          class="pill__icon"
                          width="18"
                          height="18"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#sun"></use>
                        </svg>
                        Bright Light
                      </span>
                    </label>
                    <label class="pill">
                      <input
                        class="pill__input"
                        type="checkbox"
                        name="light"
                        value="medium"
                      />
                      <span class="pill__text">
                        <svg
                          class="pill__icon"
                          width="18"
                          height="18"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#light-medium"></use>
                        </svg>
                        Medium Light
                      </span>
                    </label>
                    <label class="pill">
                      <input
                        class="pill__input"
                        type="checkbox"
                        name="light"
                        value="low"
                      />
                      <span class="pill__text">
                        <svg
                          class="pill__icon"
                          width="18"
                          height="18"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#moon"></use>
                        </svg>
                        Low Light
                      </span>
                    </label>
                  </div>
                </fieldset>

                <fieldset class="filters__group">
                  <legend class="filters__label">Pet Friendly</legend>
                  <label class="filters__checkbox">
                    <input
                      class="filters__checkbox-input"
                      type="checkbox"
                      name="petSafe"
                    />
                    <svg
                      class="filters__checkbox-icon"
                      width="20"
                      height="20"
                      aria-hidden="true"
                    >
                      <use href="/icons/sprite.svg#paw"></use>
                    </svg>
                    Pet Safe Only
                  </label>
                </fieldset>

                <fieldset class="filters__group">
                  <legend class="filters__label">Price Range</legend>
                  <div class="price-range">
                    <div class="price-range__track">
                      <div class="price-range__fill"></div>
                    </div>
                    <label class="visually-hidden" for="price-min"
                      >Minimum price</label
                    >
                    <input
                      class="price-range__input"
                      id="price-min"
                      type="range"
                      name="priceMin"
                      min="0"
                      max="100"
                      step="1"
                      value="0"
                    />
                    <label class="visually-hidden" for="price-max"
                      >Maximum price</label
                    >
                    <input
                      class="price-range__input"
                      id="price-max"
                      type="range"
                      name="priceMax"
                      min="0"
                      max="100"
                      step="1"
                      value="100"
                    />
                  </div>
                  <div class="price-range__values">
                    <output
                      class="price-range__value price-range__value_min"
                      for="price-min"
                      >$0</output
                    >
                    <output
                      class="price-range__value price-range__value_max"
                      for="price-max"
                      >$100</output
                    >
                  </div>
                </fieldset>

                <div class="filters__group">
                  <span class="filters__label" id="sort-label">Sort by</span>
                  <div class="dropdown">
                    <input
                      class="dropdown__input"
                      type="hidden"
                      name="sort"
                      value="default"
                    />
                    <button
                      class="dropdown__button"
                      id="sort-button"
                      type="button"
                      aria-haspopup="listbox"
                      aria-expanded="false"
                      aria-controls="sort-list"
                      aria-labelledby="sort-label sort-button"
                    >
                      <span class="dropdown__value">Default</span>
                      <svg
                        class="dropdown__icon"
                        width="18"
                        height="18"
                        aria-hidden="true"
                      >
                        <use href="/icons/sprite.svg#chevron-down"></use>
                      </svg>
                    </button>
                    <ul
                      class="dropdown__list"
                      id="sort-list"
                      role="listbox"
                      tabindex="-1"
                      aria-labelledby="sort-label"
                      hidden
                    >
                      <li
                        class="dropdown__option"
                        id="sort-option-default"
                        role="option"
                        data-value="default"
                        aria-selected="true"
                      >
                        Default
                        <svg
                          class="dropdown__check"
                          width="16"
                          height="16"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#check"></use>
                        </svg>
                      </li>
                      <li
                        class="dropdown__option"
                        id="sort-option-price-asc"
                        role="option"
                        data-value="price-asc"
                        aria-selected="false"
                      >
                        Price: Low to High
                        <svg
                          class="dropdown__check"
                          width="16"
                          height="16"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#check"></use>
                        </svg>
                      </li>
                      <li
                        class="dropdown__option"
                        id="sort-option-price-desc"
                        role="option"
                        data-value="price-desc"
                        aria-selected="false"
                      >
                        Price: High to Low
                        <svg
                          class="dropdown__check"
                          width="16"
                          height="16"
                          aria-hidden="true"
                        >
                          <use href="/icons/sprite.svg#check"></use>
                        </svg>
                      </li>
                    </ul>
                  </div>
                </div>
              </form>
            </aside>

            <div class="shop__catalog">
              <h2 class="visually-hidden">Products</h2>
              <p class="shop__count" aria-live="polite"></p>
              <ul class="catalog"></ul>
              <p class="shop__empty" hidden>
                No plants found. Try changing the filters or reset them.
              </p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/pages/shop.ts"></script>
  </body>
</html>
